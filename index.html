<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Studio — Gesture Controlled 3D Particles</title>
    <meta name="description" content="Interactive 3D particle system controlled by real-time hand gestures via webcam. Built with Three.js and MediaPipe.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Three.js Core -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
    <!-- Three.js Post-processing (graceful fallback if unavailable) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --accent: #ff6b9d;
            --accent-rgb: 255, 107, 157;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #050510;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── Three.js Canvas ─── */
        #scene-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
        }

        /* ─── Vignette Overlay ─── */
        #vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(3, 3, 12, 0.55) 100%);
        }

        /* ─── Control Panel ─── */
        #control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 230px;
            z-index: 20;
            background: rgba(12, 12, 28, 0.72);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            padding: 22px 18px 18px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55), inset 0 0.5px 0 rgba(255,255,255,0.06);
        }

        .panel-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .panel-title span {
            font-size: 17px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 8px;
            margin-top: 18px;
        }

        .section-label:first-of-type {
            margin-top: 0;
        }

        /* Template Buttons */
        #template-grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .template-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.22s ease;
            text-align: left;
            outline: none;
        }

        .template-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.9);
            transform: translateX(2px);
        }

        .template-btn.active {
            background: rgba(var(--accent-rgb), 0.15);
            border-color: rgba(var(--accent-rgb), 0.35);
            color: var(--accent);
            font-weight: 500;
        }

        .template-btn.active:hover {
            background: rgba(var(--accent-rgb), 0.22);
        }

        /* Color Picker Row */
        .color-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #color-picker {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        #color-picker::-webkit-color-swatch-wrapper { padding: 2px; }
        #color-picker::-webkit-color-swatch {
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
        }
        #color-picker::-moz-color-swatch {
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
        }

        #color-hex {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        /* Tension Meter */
        #tension-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden;
        }

        #tension-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #c084fc);
            border-radius: 3px;
            transition: width 0.08s linear;
        }

        #tension-value {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 5px;
            font-variant-numeric: tabular-nums;
        }

        /* Hand Position Indicator */
        #hand-pos-value {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 5px;
            font-variant-numeric: tabular-nums;
        }

        /* ─── Webcam Box ─── */
        #webcam-box {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 200px;
            z-index: 20;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.5);
            background: rgba(8, 8, 20, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        #webcam {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            transform: scaleX(-1);
            background: #0a0a18;
        }

        #hand-status {
            padding: 7px 11px;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
        }

        #status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff3b4e;
            flex-shrink: 0;
            transition: all 0.35s ease;
        }

        #status-dot.active {
            background: #3bff8a;
            box-shadow: 0 0 10px rgba(59, 255, 138, 0.5);
        }

        /* ─── Loading Overlay ─── */
        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(5, 5, 16, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-content {
            text-align: center;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 2.5px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin: 0 auto 18px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-content p {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.65);
        }

        .loader-content .sub {
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 6px;
        }

        /* ─── Responsive ─── */
        @media (max-width: 600px) {
            #control-panel {
                top: auto;
                bottom: 180px;
                right: 10px;
                left: 10px;
                width: auto;
            }
            #webcam-box {
                width: 140px;
            }
            #webcam { height: 105px; }
        }
    </style>
</head>
<body>

    <!-- Three.js render target -->
    <canvas id="scene-canvas"></canvas>

    <!-- Vignette overlay for cinematic framing -->
    <div id="vignette"></div>

    <!-- Webcam feed (used by MediaPipe + displayed as preview) -->
    <div id="webcam-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="hand-status">
            <span id="status-dot"></span>
            <span id="status-text">Initializing…</span>
        </div>
    </div>

    <!-- UI Controls -->
    <div id="control-panel">
        <div class="panel-title"><span>✨</span> Particle Studio</div>

        <div class="section-label">Shape</div>
        <div id="template-grid">
            <button class="template-btn active" data-shape="heart">♥&ensp;Heart</button>
            <button class="template-btn" data-shape="flower">✿&ensp;Flower</button>
            <button class="template-btn" data-shape="saturn">🪐&ensp;Saturn</button>
            <button class="template-btn" data-shape="buddha">☸&ensp;Buddha</button>
            <button class="template-btn" data-shape="fireworks">✦&ensp;Fireworks</button>
        </div>

        <div class="section-label">Color</div>
        <div class="color-row">
            <input type="color" id="color-picker" value="#ff6b9d">
            <span id="color-hex">#ff6b9d</span>
        </div>

        <div class="section-label">Hand Tension</div>
        <div id="tension-track">
            <div id="tension-fill"></div>
        </div>
        <div id="tension-value">0 %</div>

        <div class="section-label">Hand Position</div>
        <div id="hand-pos-value">— , —</div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Loading hand tracking model…</p>
            <p class="sub">Allow camera access when prompted</p>
        </div>
    </div>

    <!-- ═══════════════════ JAVASCRIPT ═══════════════════ -->
    <script>
    (function () {
        'use strict';

        /* ───────────── Constants ───────────── */
        var PARTICLE_COUNT  = 6000;
        var LERP_RATE       = 0.07;     // per-frame lerp at 60fps
        var TENSION_SMOOTH  = 0.14;
        var HAND_FOLLOW     = 0.10;     // shape follows hand speed
        var HAND_RETURN     = 0.015;    // shape returns to origin speed
        var STAR_COUNT      = 1400;
        var HAND_RANGE_X    = 8;        // world units of hand X range
        var HAND_RANGE_Y    = 6;        // world units of hand Y range
        var ATTRACT_STRENGTH = 0.12;    // per-particle attraction to hand

        /* ───────────── State ───────────── */
        var smoothTension   = 0.5;
        var rawTension      = 0.5;
        var isHandDetected  = false;
        var currentScale    = 1.0;
        var currentShape    = 'heart';
        var time            = 0;
        var mouseX          = 0;
        var mouseY          = 0;
        var particleColor   = new THREE.Color('#ff6b9d');

        // Hand position state
        var rawHandX = 0.5, rawHandY = 0.5;
        var handWorldX = 0, handWorldY = 0;
        var targetHandWorldX = 0, targetHandWorldY = 0;
        var prevRawHandX = 0.5, prevRawHandY = 0.5;
        var handSpeed = 0;

        // Shape center (follows hand)
        var shapeCenterX = 0, shapeCenterY = 0;

        var baseTargetPositions = null;
        var targetPositions     = null;

        /* ───────────── DOM refs ───────────── */
        var canvas         = document.getElementById('scene-canvas');
        var videoEl        = document.getElementById('webcam');
        var statusDot      = document.getElementById('status-dot');
        var statusText     = document.getElementById('status-text');
        var tensionFill    = document.getElementById('tension-fill');
        var tensionValue   = document.getElementById('tension-value');
        var colorPicker    = document.getElementById('color-picker');
        var colorHex       = document.getElementById('color-hex');
        var loadingOverlay = document.getElementById('loading-overlay');
        var handPosValue   = document.getElementById('hand-pos-value');

        /* ════════════════════════════════════════════
           1. PARTICLE TEXTURE (high-res soft radial glow)
           ════════════════════════════════════════════ */
        function createParticleTexture() {
            var sz = 256, c = document.createElement('canvas');
            c.width = sz; c.height = sz;
            var ctx = c.getContext('2d'), h = sz / 2;
            var g = ctx.createRadialGradient(h, h, 0, h, h, h);
            g.addColorStop(0,    'rgba(255,255,255,1)');
            g.addColorStop(0.04, 'rgba(255,255,255,0.96)');
            g.addColorStop(0.12, 'rgba(255,255,255,0.75)');
            g.addColorStop(0.28, 'rgba(255,255,255,0.38)');
            g.addColorStop(0.50, 'rgba(255,255,255,0.12)');
            g.addColorStop(0.75, 'rgba(255,255,255,0.03)');
            g.addColorStop(1,    'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, sz, sz);
            return new THREE.CanvasTexture(c);
        }

        /* ════════════════════════════════════════════
           2. SHAPE GENERATORS — each returns Float32Array(count * 3)
           ════════════════════════════════════════════ */

        function generateHeart(count) {
            var pos = new Float32Array(count * 3);
            for (var i = 0; i < count; i++) {
                var t = Math.random() * Math.PI * 2;
                var hx = 16 * Math.pow(Math.sin(t), 3);
                var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                var angle = Math.random() * Math.PI * 2;
                var r     = Math.abs(hx);
                var depth  = 0.75 + Math.random() * 0.5;
                var noise  = 0.35;
                pos[i * 3]     = r * Math.cos(angle) * 0.12 * depth + (Math.random() - 0.5) * noise;
                pos[i * 3 + 1] = hy * 0.12 + (Math.random() - 0.5) * noise;
                pos[i * 3 + 2] = r * Math.sin(angle) * 0.12 * depth + (Math.random() - 0.5) * noise;
            }
            return pos;
        }

        function generateFlower(count) {
            var pos = new Float32Array(count * 3);
            var petals = 5;
            for (var i = 0; i < count; i++) {
                if (Math.random() < 0.12) {
                    var phi   = Math.acos(2 * Math.random() - 1);
                    var theta = Math.random() * Math.PI * 2;
                    var r     = Math.random() * 0.55;
                    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                    pos[i * 3 + 1] = r * Math.cos(phi) * 0.5 + 0.15;
                    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
                } else if (Math.random() < 0.06) {
                    pos[i * 3]     = (Math.random() - 0.5) * 0.12;
                    pos[i * 3 + 1] = -Math.random() * 2.8;
                    pos[i * 3 + 2] = (Math.random() - 0.5) * 0.12;
                } else {
                    var th     = Math.random() * Math.PI * 2;
                    var petalR = 2.6 * Math.pow(Math.abs(Math.cos(petals * th / 2)), 0.75);
                    var rr     = petalR * (0.25 + Math.random() * 0.75);
                    pos[i * 3]     = rr * Math.cos(th) + (Math.random() - 0.5) * 0.18;
                    pos[i * 3 + 1] = (Math.random() - 0.5) * 0.35 + Math.sin(rr * 0.6) * 0.35;
                    pos[i * 3 + 2] = rr * Math.sin(th) + (Math.random() - 0.5) * 0.18;
                }
            }
            return pos;
        }

        function generateSaturn(count) {
            var pos     = new Float32Array(count * 3);
            var sphereN = Math.floor(count * 0.5);
            var i, phi, theta, r, angle;
            for (i = 0; i < sphereN; i++) {
                phi   = Math.acos(2 * Math.random() - 1);
                theta = Math.random() * Math.PI * 2;
                r     = 1.25 * (0.82 + Math.random() * 0.36);
                pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                pos[i * 3 + 1] = r * 0.82 * Math.cos(phi);
                pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            }
            var tiltAngle = 0.38;
            var cosT = Math.cos(tiltAngle), sinT = Math.sin(tiltAngle);
            for (i = sphereN; i < count; i++) {
                angle = Math.random() * Math.PI * 2;
                r     = 2.1 + Math.random() * 1.3;
                var flat = (Math.random() - 0.5) * 0.1;
                var px = r * Math.cos(angle);
                var py = flat;
                var pz = r * Math.sin(angle);
                pos[i * 3]     = px;
                pos[i * 3 + 1] = py * cosT - pz * sinT;
                pos[i * 3 + 2] = py * sinT + pz * cosT;
            }
            return pos;
        }

        function generateBuddha(count) {
            var parts = [
                [0,  3.20, 0,    0.55, 0.65, 0.55, 0.12],
                [0,  3.90, 0,    0.20, 0.30, 0.20, 0.025],
                [0,  2.65, 0,    0.24, 0.18, 0.22, 0.02],
                [0,  2.00, 0,    0.85, 0.55, 0.50, 0.17],
                [0,  1.30, 0.06, 0.95, 0.45, 0.58, 0.14],
                [-0.92, 1.60, 0.14, 0.24, 0.60, 0.20, 0.055],
                [ 0.92, 1.60, 0.14, 0.24, 0.60, 0.20, 0.055],
                [-1.08, 0.92, 0.22, 0.22, 0.35, 0.18, 0.035],
                [ 1.08, 0.92, 0.22, 0.22, 0.35, 0.18, 0.035],
                [0,  0.35, 0,    1.40, 0.36, 0.72, 0.22],
                [-1.18, 0.50, 0.28, 0.18, 0.18, 0.18, 0.025],
                [ 1.18, 0.50, 0.28, 0.18, 0.18, 0.18, 0.025],
                [0, -0.05, 0,    1.52, 0.13, 0.82, 0.02],
            ];
            var pos = new Float32Array(count * 3);
            var idx = 0;
            for (var p = 0; p < parts.length; p++) {
                var part = parts[p];
                var cx = part[0], cy = part[1], cz = part[2];
                var rx = part[3], ry = part[4], rz = part[5], w = part[6];
                var n = Math.floor(count * w);
                for (var j = 0; j < n && idx < count; j++, idx++) {
                    var theta = Math.random() * Math.PI * 2;
                    var phi   = Math.acos(2 * Math.random() - 1);
                    var rr    = 0.65 + Math.random() * 0.35;
                    pos[idx * 3]     = cx + rx * rr * Math.sin(phi) * Math.cos(theta);
                    pos[idx * 3 + 1] = cy + ry * rr * Math.cos(phi);
                    pos[idx * 3 + 2] = cz + rz * rr * Math.sin(phi) * Math.sin(theta);
                }
            }
            while (idx < count) {
                var pp = parts[Math.floor(Math.random() * parts.length)];
                var t2 = Math.random() * Math.PI * 2;
                var p2 = Math.acos(2 * Math.random() - 1);
                pos[idx * 3]     = pp[0] + pp[3] * Math.sin(p2) * Math.cos(t2);
                pos[idx * 3 + 1] = pp[1] + pp[4] * Math.cos(p2);
                pos[idx * 3 + 2] = pp[2] + pp[5] * Math.sin(p2) * Math.sin(t2);
                idx++;
            }
            var sumY = 0;
            for (var k = 0; k < count; k++) sumY += pos[k * 3 + 1];
            var avgY = sumY / count;
            for (var k2 = 0; k2 < count; k2++) pos[k2 * 3 + 1] -= avgY;
            var sc = 0.72;
            for (var k3 = 0; k3 < count * 3; k3++) pos[k3] *= sc;
            return pos;
        }

        function generateFireworks(count) {
            var pos    = new Float32Array(count * 3);
            var bursts = 7;
            var perB   = Math.floor(count / bursts);
            for (var b = 0; b < bursts; b++) {
                var cx = (Math.random() - 0.5) * 6;
                var cy = (Math.random() - 0.5) * 5;
                var cz = (Math.random() - 0.5) * 3;
                var br = 0.8 + Math.random() * 1.8;
                for (var i = 0; i < perB; i++) {
                    var idx = b * perB + i;
                    if (idx >= count) break;
                    var phi   = Math.acos(2 * Math.random() - 1);
                    var theta = Math.random() * Math.PI * 2;
                    var trail = Math.pow(Math.random(), 0.6);
                    var r     = br * trail;
                    pos[idx * 3]     = cx + r * Math.sin(phi) * Math.cos(theta);
                    pos[idx * 3 + 1] = cy + r * Math.cos(phi);
                    pos[idx * 3 + 2] = cz + r * Math.sin(phi) * Math.sin(theta);
                }
            }
            for (var j = bursts * perB; j < count; j++) {
                pos[j * 3]     = (Math.random() - 0.5) * 8;
                pos[j * 3 + 1] = (Math.random() - 0.5) * 8;
                pos[j * 3 + 2] = (Math.random() - 0.5) * 5;
            }
            return pos;
        }

        var generators = {
            heart:     generateHeart,
            flower:    generateFlower,
            saturn:    generateSaturn,
            buddha:    generateBuddha,
            fireworks: generateFireworks
        };

        /* ════════════════════════════════════════════
           3. THREE.JS SCENE
           ════════════════════════════════════════════ */
        var clock    = new THREE.Clock();
        var scene    = new THREE.Scene();
        var camera   = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 0, 8);

        var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x050510);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;

        /* ── Twinkling star background ── */
        (function createStars() {
            var g = new THREE.BufferGeometry();
            var p = new Float32Array(STAR_COUNT * 3);
            var aRandom = new Float32Array(STAR_COUNT);
            for (var i = 0; i < STAR_COUNT; i++) {
                p[i * 3]     = (Math.random() - 0.5) * 100;
                p[i * 3 + 1] = (Math.random() - 0.5) * 100;
                p[i * 3 + 2] = (Math.random() - 0.5) * 100;
                aRandom[i]   = Math.random();
            }
            g.setAttribute('position', new THREE.BufferAttribute(p, 3));
            g.setAttribute('aRandom',  new THREE.BufferAttribute(aRandom, 1));
            var m = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 } },
                vertexShader: [
                    'attribute float aRandom;',
                    'uniform float uTime;',
                    'varying float vAlpha;',
                    'void main() {',
                    '    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);',
                    '    gl_PointSize = 1.2 + aRandom * 1.8;',
                    '    gl_Position = projectionMatrix * mvPos;',
                    '    vAlpha = 0.12 + 0.38 * (0.5 + 0.5 * sin(uTime * (0.2 + aRandom * 0.8) + aRandom * 6.2832));',
                    '}'
                ].join('\n'),
                fragmentShader: [
                    'varying float vAlpha;',
                    'void main() {',
                    '    float d = length(gl_PointCoord - 0.5) * 2.0;',
                    '    float a = smoothstep(1.0, 0.0, d) * vAlpha;',
                    '    if (a < 0.01) discard;',
                    '    gl_FragColor = vec4(0.85, 0.88, 1.0, a);',
                    '}'
                ].join('\n'),
                transparent: true,
                depthWrite: false
            });
            var starPoints = new THREE.Points(g, m);
            starPoints.userData.material = m;
            scene.add(starPoints);
        })();

        /* ── Particle system ── */
        var particleTexture = createParticleTexture();
        var pGeometry  = new THREE.BufferGeometry();
        var pPositions = new Float32Array(PARTICLE_COUNT * 3);
        var pSizes     = new Float32Array(PARTICLE_COUNT);
        var pRandoms   = new Float32Array(PARTICLE_COUNT);

        for (var i = 0; i < PARTICLE_COUNT; i++) {
            pPositions[i * 3]     = (Math.random() - 0.5) * 12;
            pPositions[i * 3 + 1] = (Math.random() - 0.5) * 12;
            pPositions[i * 3 + 2] = (Math.random() - 0.5) * 12;
            pSizes[i]   = 0.4 + Math.random() * 1.0;
            pRandoms[i] = Math.random();
        }

        pGeometry.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        pGeometry.setAttribute('aSize',    new THREE.BufferAttribute(pSizes, 1));
        pGeometry.setAttribute('aRandom',  new THREE.BufferAttribute(pRandoms, 1));

        /* ── Core particle shader (with hand-awareness) ── */
        var pMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uColor:      { value: particleColor },
                uSize:       { value: 5.5 },
                uTexture:    { value: particleTexture },
                uTime:       { value: 0 },
                uPixelRatio: { value: renderer.getPixelRatio() },
                uHandPos:    { value: new THREE.Vector3(0, 0, 0) },
                uHandActive: { value: 0.0 }
            },
            vertexShader: [
                'attribute float aSize;',
                'attribute float aRandom;',
                'uniform float uSize;',
                'uniform float uTime;',
                'uniform float uPixelRatio;',
                'uniform vec3  uHandPos;',
                'uniform float uHandActive;',
                'varying float vAlpha;',
                'varying float vRandom;',
                'varying float vDistToHand;',
                '',
                'void main() {',
                '    vec3 pos = position;',
                '    float distToHand = length(pos.xy - uHandPos.xy);',
                '    vDistToHand = distToHand;',
                '    vRandom = aRandom;',
                '',
                '    vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);',
                '',
                '    // Pulse + hand proximity size boost',
                '    float pulse = 0.85 + 0.15 * sin(uTime * 1.8 + aRandom * 6.2832);',
                '    float handBoost = uHandActive * max(0.0, 1.0 - distToHand * 0.18) * 0.6;',
                '    float finalSize = uSize * aSize * (pulse + handBoost);',
                '',
                '    gl_PointSize = finalSize * uPixelRatio * (220.0 / -mvPos.z);',
                '    gl_PointSize = max(gl_PointSize, 1.2);',
                '    gl_Position = projectionMatrix * mvPos;',
                '',
                '    vAlpha = 0.50 + 0.50 * sin(uTime * 1.3 + aRandom * 6.2832);',
                '}'
            ].join('\n'),
            fragmentShader: [
                'uniform vec3 uColor;',
                'uniform sampler2D uTexture;',
                'uniform float uTime;',
                'uniform float uHandActive;',
                'varying float vAlpha;',
                'varying float vRandom;',
                'varying float vDistToHand;',
                '',
                'void main() {',
                '    vec4 tex = texture2D(uTexture, gl_PointCoord);',
                '    float a = tex.a * vAlpha;',
                '    if (a < 0.01) discard;',
                '',
                '    // Warm core near hand, saturated color far away',
                '    float proximity = 1.0 - clamp(vDistToHand * 0.15, 0.0, 1.0);',
                '    vec3 warm = uColor + vec3(0.35, 0.22, 0.08) * proximity * uHandActive;',
                '',
                '    // Subtle hue shimmer per particle',
                '    float hueShift = sin(vRandom * 6.2832 + uTime * 0.4) * 0.06;',
                '    warm.r += hueShift;',
                '    warm.b -= hueShift * 0.5;',
                '    warm = clamp(warm, 0.0, 1.0);',
                '',
                '    // Brighter core for depth',
                '    float coreBright = 0.65 + 0.35 * tex.r;',
                '    gl_FragColor = vec4(warm * coreBright, a);',
                '}'
            ].join('\n'),
            transparent:  true,
            blending:     THREE.AdditiveBlending,
            depthWrite:   false,
            depthTest:    true
        });

        var points = new THREE.Points(pGeometry, pMaterial);
        scene.add(points);

        /* ── Glow layer (same geometry, bigger & softer — bloom substitute) ── */
        var glowMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uColor:      { value: particleColor },
                uSize:       { value: 14.0 },
                uTexture:    { value: particleTexture },
                uTime:       { value: 0 },
                uPixelRatio: { value: renderer.getPixelRatio() }
            },
            vertexShader: [
                'attribute float aSize;',
                'attribute float aRandom;',
                'uniform float uSize;',
                'uniform float uTime;',
                'uniform float uPixelRatio;',
                'varying float vAlpha;',
                '',
                'void main() {',
                '    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);',
                '    float pulse = 0.9 + 0.1 * sin(uTime * 0.9 + aRandom * 6.2832);',
                '    gl_PointSize = uSize * aSize * pulse * uPixelRatio * (220.0 / -mvPos.z);',
                '    gl_PointSize = max(gl_PointSize, 0.5);',
                '    gl_Position = projectionMatrix * mvPos;',
                '    vAlpha = 0.06 + 0.04 * sin(uTime * 0.7 + aRandom * 6.2832);',
                '}'
            ].join('\n'),
            fragmentShader: [
                'uniform vec3 uColor;',
                'uniform sampler2D uTexture;',
                'varying float vAlpha;',
                '',
                'void main() {',
                '    vec4 tex = texture2D(uTexture, gl_PointCoord);',
                '    float a = tex.a * vAlpha;',
                '    if (a < 0.005) discard;',
                '    gl_FragColor = vec4(uColor * 0.8, a);',
                '}'
            ].join('\n'),
            transparent:  true,
            blending:     THREE.AdditiveBlending,
            depthWrite:   false,
            depthTest:    false
        });

        var glowPoints = new THREE.Points(pGeometry, glowMaterial);
        scene.add(glowPoints);

        /* ── Hand cursor glow (single bright point at hand position) ── */
        var cursorGeo = new THREE.BufferGeometry();
        cursorGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
        cursorGeo.setAttribute('aSize',   new THREE.BufferAttribute(new Float32Array([1]), 1));
        cursorGeo.setAttribute('aRandom', new THREE.BufferAttribute(new Float32Array([0.5]), 1));
        var cursorMat = new THREE.PointsMaterial({
            size: 1.2,
            map: particleTexture,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            color: particleColor
        });
        var cursorPoint = new THREE.Points(cursorGeo, cursorMat);
        scene.add(cursorPoint);

        /* ── Initialise shape targets ── */
        baseTargetPositions = generateHeart(PARTICLE_COUNT);
        targetPositions     = new Float32Array(baseTargetPositions);

        /* ── Post-processing bloom (graceful fallback) ── */
        var composer  = null;
        var bloomPass = null;
        var useBloom  = false;

        try {
            if (typeof THREE.EffectComposer !== 'undefined' &&
                typeof THREE.RenderPass !== 'undefined' &&
                typeof THREE.UnrealBloomPass !== 'undefined') {

                var renderPass = new THREE.RenderPass(scene, camera);
                bloomPass = new THREE.UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    1.2,    // strength
                    0.5,    // radius
                    0.72    // threshold
                );
                composer = new THREE.EffectComposer(renderer);
                composer.addPass(renderPass);
                composer.addPass(bloomPass);
                useBloom = true;
                console.log('[Particle Studio] Bloom post-processing enabled.');
            }
        } catch (e) {
            console.warn('[Particle Studio] Bloom unavailable, using glow-layer fallback.', e);
            useBloom = false;
        }

        /* ════════════════════════════════════════════
           4. HAND TRACKING (MediaPipe) — position + tension
           ════════════════════════════════════════════ */
        function calculateTension(landmarks) {
            var palm = landmarks[9];
            var tips = [4, 8, 12, 16, 20];
            var total = 0;
            for (var t = 0; t < tips.length; t++) {
                var tip = landmarks[tips[t]];
                var dx = tip.x - palm.x;
                var dy = tip.y - palm.y;
                var dz = (tip.z || 0) - (palm.z || 0);
                total += Math.sqrt(dx * dx + dy * dy + dz * dz);
            }
            var avg = total / tips.length;
            return Math.max(0, Math.min(1, (avg - 0.04) / 0.22));
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;

                var tensionSum = 0;
                var cx = 0, cy = 0;
                var numHands = results.multiHandLandmarks.length;

                for (var h = 0; h < numHands; h++) {
                    var lm = results.multiHandLandmarks[h];
                    tensionSum += calculateTension(lm);

                    // Hand centroid: average of wrist + finger MCP joints
                    var keyPts = [0, 5, 9, 13, 17];
                    var hx = 0, hy = 0;
                    for (var k = 0; k < keyPts.length; k++) {
                        hx += lm[keyPts[k]].x;
                        hy += lm[keyPts[k]].y;
                    }
                    cx += hx / keyPts.length;
                    cy += hy / keyPts.length;
                }

                rawTension = tensionSum / numHands;
                rawHandX   = cx / numHands;
                rawHandY   = cy / numHands;

                // Map normalised hand coords → 3D world space (mirrored for natural feel)
                targetHandWorldX = (0.5 - rawHandX) * HAND_RANGE_X;
                targetHandWorldY = (0.5 - rawHandY) * HAND_RANGE_Y;

                // Clamp to keep shape on-screen
                targetHandWorldX = Math.max(-4.5, Math.min(4.5, targetHandWorldX));
                targetHandWorldY = Math.max(-3.2, Math.min(3.2, targetHandWorldY));

                // Track hand movement speed
                var dxH = rawHandX - prevRawHandX;
                var dyH = rawHandY - prevRawHandY;
                handSpeed = Math.sqrt(dxH * dxH + dyH * dyH);
                prevRawHandX = rawHandX;
                prevRawHandY = rawHandY;

            } else {
                isHandDetected = false;
                handSpeed *= 0.92;
            }
        }

        function initHandTracking() {
            try {
                if (typeof Hands === 'undefined') throw new Error('MediaPipe Hands not loaded.');
                if (typeof Camera === 'undefined') throw new Error('MediaPipe Camera Utils not loaded.');

                var hands = new Hands({
                    locateFile: function (file) {
                        return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + file;
                    }
                });

                hands.setOptions({
                    maxNumHands:           2,
                    modelComplexity:       1,
                    minDetectionConfidence: 0.55,
                    minTrackingConfidence:  0.45
                });

                hands.onResults(onHandResults);

                var cam = new Camera(videoEl, {
                    onFrame: function () {
                        return hands.send({ image: videoEl });
                    },
                    width:  640,
                    height: 480
                });

                cam.start().then(function () {
                    console.log('[Particle Studio] Camera & hand tracking started.');
                    loadingOverlay.classList.add('hidden');
                    statusText.textContent = 'No hands detected';
                }).catch(function (err) {
                    console.error('[Particle Studio] Camera start failed:', err);
                    loadingOverlay.classList.add('hidden');
                    statusText.textContent = 'Camera denied';
                });

            } catch (err) {
                console.error('[Particle Studio] Hand tracking init error:', err);
                loadingOverlay.classList.add('hidden');
                statusText.textContent = 'Tracking unavailable';
            }
        }

        // Safety: hide overlay after 18 s no matter what
        setTimeout(function () {
            if (!loadingOverlay.classList.contains('hidden')) {
                loadingOverlay.classList.add('hidden');
                if (!isHandDetected) statusText.textContent = 'Tracking unavailable';
            }
        }, 18000);

        /* ════════════════════════════════════════════
           5. UI EVENT HANDLERS
           ════════════════════════════════════════════ */

        // Template buttons
        var templateBtns = document.querySelectorAll('.template-btn');
        for (var b = 0; b < templateBtns.length; b++) {
            (function (btn) {
                btn.addEventListener('click', function () {
                    for (var k = 0; k < templateBtns.length; k++) templateBtns[k].classList.remove('active');
                    btn.classList.add('active');
                    var shape = btn.getAttribute('data-shape');
                    if (generators[shape]) {
                        currentShape = shape;
                        baseTargetPositions = generators[shape](PARTICLE_COUNT);
                    }
                });
            })(templateBtns[b]);
        }

        // Colour picker
        colorPicker.addEventListener('input', function (e) {
            var hex = e.target.value;
            particleColor.set(hex);
            cursorMat.color.set(hex);
            colorHex.textContent = hex;

            var r = parseInt(hex.slice(1, 3), 16);
            var g = parseInt(hex.slice(3, 5), 16);
            var bl = parseInt(hex.slice(5, 7), 16);
            document.documentElement.style.setProperty('--accent', hex);
            document.documentElement.style.setProperty('--accent-rgb', r + ',' + g + ',' + bl);
        });

        // Mouse parallax
        window.addEventListener('mousemove', function (e) {
            mouseX = (e.clientX / window.innerWidth  - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        // Resize
        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            pMaterial.uniforms.uPixelRatio.value = renderer.getPixelRatio();
            glowMaterial.uniforms.uPixelRatio.value = renderer.getPixelRatio();
            if (useBloom && composer) {
                composer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        /* ════════════════════════════════════════════
           6. ANIMATION LOOP
           ════════════════════════════════════════════ */
        var smoothHandActive = 0;

        function animate() {
            requestAnimationFrame(animate);

            var delta = clock.getDelta();
            var d60   = Math.min(delta * 60, 3); // frame multiplier, capped at 3
            time += delta;

            pMaterial.uniforms.uTime.value   = time;
            glowMaterial.uniforms.uTime.value = time;

            // Update twinkling stars
            scene.children.forEach(function (child) {
                if (child.userData && child.userData.material) {
                    child.userData.material.uniforms.uTime.value = time;
                }
            });

            /* ── Smooth hand tracking values ── */
            smoothTension  += (rawTension - smoothTension) * TENSION_SMOOTH * d60;
            handWorldX     += (targetHandWorldX - handWorldX) * HAND_FOLLOW * d60;
            handWorldY     += (targetHandWorldY - handWorldY) * HAND_FOLLOW * d60;
            smoothHandActive += ((isHandDetected ? 1.0 : 0.0) - smoothHandActive) * 0.08 * d60;

            /* ── Shape center follows hand ── */
            if (isHandDetected) {
                shapeCenterX += (handWorldX - shapeCenterX) * HAND_FOLLOW * d60;
                shapeCenterY += (handWorldY - shapeCenterY) * HAND_FOLLOW * d60;
            } else {
                // Drift back to origin
                shapeCenterX += (0 - shapeCenterX) * HAND_RETURN * d60;
                shapeCenterY += (0 - shapeCenterY) * HAND_RETURN * d60;
            }

            /* ── Scale from tension ── */
            var targetScaleVal;
            if (isHandDetected) {
                targetScaleVal = 0.45 + smoothTension * 1.55;
            } else {
                targetScaleVal = 1.0 + Math.sin(time * 0.7) * 0.08;
            }
            currentScale += (targetScaleVal - currentScale) * 0.045 * d60;

            /* ── Expansion / contraction factor ── */
            var expansion = isHandDetected ? (0.55 + smoothTension * 0.9) : 1.0;

            /* ── Compute per-particle target positions ── */
            var turbulence = Math.min(handSpeed * 12, 0.4);
            for (var i = 0; i < PARTICLE_COUNT; i++) {
                var i3 = i * 3;

                // Base: shape × expansion + shape center offset
                var tx = baseTargetPositions[i3]     * expansion + shapeCenterX;
                var ty = baseTargetPositions[i3 + 1] * expansion + shapeCenterY;
                var tz = baseTargetPositions[i3 + 2] * expansion;

                // Subtle magnetic attraction toward hand position
                if (isHandDetected) {
                    var dx = handWorldX - tx;
                    var dy = handWorldY - ty;
                    var dist = Math.sqrt(dx * dx + dy * dy) + 0.01;
                    var attract = ATTRACT_STRENGTH / (1 + dist * 0.4);
                    tx += dx * attract;
                    ty += dy * attract;
                }

                // Turbulence from fast hand movement
                if (turbulence > 0.01) {
                    tx += Math.sin(time * 3.0 + i * 0.12) * turbulence * 0.3;
                    ty += Math.cos(time * 2.7 + i * 0.09) * turbulence * 0.3;
                }

                targetPositions[i3]     = tx;
                targetPositions[i3 + 1] = ty;
                targetPositions[i3 + 2] = tz;
            }

            /* ── Lerp particle positions toward targets ── */
            var arr  = pGeometry.attributes.position.array;
            var lerp = LERP_RATE * d60;
            for (var j = 0; j < PARTICLE_COUNT; j++) {
                var j3 = j * 3;
                // Organic per-particle float
                var floatY = Math.sin(time * 0.5 + j * 0.007) * 0.003;
                arr[j3]     += (targetPositions[j3]     - arr[j3])     * lerp;
                arr[j3 + 1] += (targetPositions[j3 + 1] - arr[j3 + 1]) * lerp + floatY;
                arr[j3 + 2] += (targetPositions[j3 + 2] - arr[j3 + 2]) * lerp;
            }
            pGeometry.attributes.position.needsUpdate = true;

            /* ── Update shader uniforms ── */
            pMaterial.uniforms.uHandPos.value.set(handWorldX, handWorldY, 0);
            pMaterial.uniforms.uHandActive.value = smoothHandActive;

            /* ── Scale the whole group ── */
            points.scale.setScalar(currentScale);
            glowPoints.scale.setScalar(currentScale);

            /* ── Auto-rotate ── */
            points.rotation.y    += 0.002 * d60;
            points.rotation.x    = Math.sin(time * 0.18) * 0.06;
            glowPoints.rotation.copy(points.rotation);

            /* ── Hand cursor glow ── */
            if (isHandDetected) {
                cursorPoint.position.set(handWorldX, handWorldY, 1.5);
                cursorMat.opacity += (0.55 - cursorMat.opacity) * 0.08 * d60;
                var cursorPulse = 1.0 + Math.sin(time * 3) * 0.2;
                cursorMat.size = cursorPulse;
            } else {
                cursorMat.opacity += (0 - cursorMat.opacity) * 0.04 * d60;
            }

            /* ── Subtle camera parallax ── */
            camera.position.x += (mouseX * 0.6 - camera.position.x) * 0.02 * d60;
            camera.position.y += (-mouseY * 0.35 - camera.position.y) * 0.02 * d60;
            camera.lookAt(0, 0, 0);

            /* ── Update UI indicators ── */
            if (isHandDetected) {
                statusDot.className  = 'active';
                statusText.textContent = 'Hand detected';
            } else {
                statusDot.className  = '';
                if (statusText.textContent === 'Hand detected' || statusText.textContent === 'No hands detected') {
                    statusText.textContent = 'No hands detected';
                }
            }
            var pct = Math.round(smoothTension * 100);
            tensionFill.style.width = pct + '%';
            tensionValue.textContent = pct + ' %';

            // Hand position display
            if (isHandDetected) {
                handPosValue.textContent =
                    'X: ' + handWorldX.toFixed(1) + '  Y: ' + handWorldY.toFixed(1);
            } else {
                handPosValue.textContent = '— , —';
            }

            /* ── Render ── */
            if (useBloom && composer) {
                composer.render();
            } else {
                renderer.render(scene, camera);
            }
        }

        /* ════════════════════════════════════════════
           7. BOOT
           ════════════════════════════════════════════ */
        animate();
        initHandTracking();

    })();
    </script>
</body>
</html>
